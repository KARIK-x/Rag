[project]
name = "locus-rag"
version = "0.1.0"
description = "High-reliability institutional knowledge and retrieval system for LOCUS"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "lancedb>=0.12.0",
    "sqlite-utils>=3.36",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
